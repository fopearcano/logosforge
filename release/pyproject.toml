[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "logosforge"
version = "1.0.0"
description = "A narrative operating system for structured writing"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6,<6.9",
    "sqlmodel>=0.0.16,<1.0",
]

[project.scripts]
logosforge = "run:main"

[project.gui-scripts]
logosforge-gui = "run:main"

[tool.setuptools.packages.find]
include = ["storyplanner*"]

[tool.setuptools.package-data]
storyplanner = ["plugins/**/*.py"]
